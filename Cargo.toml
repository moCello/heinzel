[package]
name = "heinzel"
version = "0.0.0"
edition = "2024"
description = "Starts, watches, continues and stops headless agent sessions."
publish = false

[dependencies]
# `setsid` for the detached holder, and `kill` for a stop.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reading only: heinzel never writes its config file.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
